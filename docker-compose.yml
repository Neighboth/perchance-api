services:
  perchance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perchance-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - HOST=0.0.0.0
    volumes:
      - perchance_profile:/root/.perchance_profile
      - ./.env:/app/.env:ro

volumes:
  perchance_profile:
